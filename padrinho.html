<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Convite Especial</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background: white;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            text-align: center;
            max-width: 400px;
            width: 90%;
            transition: all 0.3s ease;
        }
        h1 {
            color: #4a5568;
            font-size: 24px;
            margin-bottom: 20px;
        }
        p {
            color: #718096;
            font-size: 16px;
            line-height: 1.5;
            margin-bottom: 25px;
        }
        
        /* Botão Redondo Vermelho da Tela Inicial */
        .btn-red-round {
            width: 100px;
            height: 100px;
            background-color: #ff0000;
            border-radius: 50%;
            border: none;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(255, 0, 0, 0.5);
            transition: transform 0.1s, box-shadow 0.2s;
            background: radial-gradient(circle at 30% 30%, #ff4d4d 5%, #ff0000 60%, #990000 100%);
            margin: 20px auto;
            display: inline-block;
        }
        .btn-red-round:hover {
            box-shadow: 0 6px 20px rgba(255, 0, 0, 0.8);
            transform: translateY(-2px);
        }
        .btn-red-round:active {
            transform: translateY(1px);
            box-shadow: 0 2px 10px rgba(255, 0, 0, 0.6);
            background: radial-gradient(circle at 30% 30%, #ff6666 5%, #e60000 60%, #800000 100%);
        }

        /* Botões padrão / voltar */
        .btn {
            background-color: #667eea;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
            margin: 8px 0;
            width: 100%;
        }
        .btn:hover {
            background-color: #5a67d8;
            transform: translateY(-2px);
        }

        /* Botão Secondary Verde */
        .btn-secondary {
            background-color: #48bb78;
        }
        .btn-secondary:hover {
            background-color: #38a169;
        }

        /* Botão Accent Vermelho */
        .btn-accent {
            background-color: #e53e3e;
        }
        .btn-accent:hover {
            background-color: #c53030;
        }

        .hidden {
            display: none;
        }
        .fade-in {
            animation: fadeIn 0.5s ease-in-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="card">
        <!-- Tela Inicial com o Botão Redondo Vermelho -->
        <div id="tela-inicial" class="fade-in">
            <h1>O que que esse botão faz?</h1>
            <button class="btn-red-round" onclick="mostrarMensagem()"></button>
        </div>

        <!-- Tela de Opções (Com o botão 1 Verde e o botão 2 Vermelho) -->
        <div id="tela-opcoes" class="hidden fade-in">
            <h1>Já foi padrinho de casamento?</h1>
            <button class="btn btn-secondary" onclick="abrirTela1()">Sim ✅</button>
            <button class="btn btn-accent" onclick="abrirTela2()">Não ❌</button>
        </div>

        <!-- Tela 1 (Abre ao clicar no botão verde) -->
        <div id="tela-1" class="hidden fade-in">
            <h1>Ótimo</h1>
            <p><strong>Dia 01/12</strong> você será novamente, <strong>padrinho de Clayton e Vinicius</strong>. Mais detalhes em breve.</p>
            <button class="btn" onclick="voltarOpcoes()">⬅ Voltar</button>
        </div>

        <!-- Tela 2 (Abre ao clicar no botão vermelho) -->
        <div id="tela-2" class="hidden fade-in">
            <h1>Pois agora vai ser</h1>
            <p><strong>Dia 01/12</strong> você será, <strong>padrinho de Clayton e Vinicius</strong>. Mais detalhes em breve.</p>
            <button class="btn" onclick="voltarOpcoes()">⬅ Voltar</button>
        </div>
    </div>

    <script>
        function mostrarMensagem() {
            document.getElementById('tela-inicial').classList.add('hidden');
            document.getElementById('tela-opcoes').classList.remove('hidden');
        }

        function abrirTela1() {
            document.getElementById('tela-opcoes').classList.add('hidden');
            document.getElementById('tela-1').classList.remove('hidden');
        }

        function abrirTela2() {
            document.getElementById('tela-opcoes').classList.add('hidden');
            document.getElementById('tela-2').classList.remove('hidden');
        }

        function voltarOpcoes() {
            document.getElementById('tela-1').classList.add('hidden');
            document.getElementById('tela-2').classList.add('hidden');
            document.getElementById('tela-opcoes').classList.remove('hidden');
        }
    </script>

</body>
</html>
